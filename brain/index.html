<style>
:root {
  --bg: #050508; --sb: #06060b; --border: #13132a;
  --text: #c8c8e0; --text2: #5a5a90; --text3: #2a2a50;
  --brand: #b38600; --brand-bg: rgba(179,134,0,0.13);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: 'Inter', -apple-system, sans-serif; font-weight: 500; letter-spacing: -0.01em; }
#app { display: flex; flex-direction: column; height: 100vh; }

/* TOP BAR */
#topbar { display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 48px;
  flex-shrink: 0; background: var(--bg); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 7px; user-select: none; }
.brand-logo { height: 18px; width: auto; color: var(--text); flex-shrink: 0; }
.brand-name { font-size: 13px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
.brand-sep { font-size: 10px; color: var(--text3); }
.brand-sub { font-size: 9px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .09em; }
#sw { display: flex; gap: 5px; margin-left: auto; }
.lbtn { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; padding: 4px 13px;
  border-radius: 20px; cursor: pointer; border: 1px solid var(--border); background: transparent;
  color: var(--text2); display: flex; align-items: center; gap: 5px; transition: all .12s; }
.lbtn .dot { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--text3); display: inline-block; }
.lbtn:hover { color: var(--text); border-color: #3a3a70; }
.lbtn.active { background: var(--brand); border-color: var(--brand); color: #100c00; font-weight: 600; }
.lbtn.active .dot { background: #100c00; border-color: #100c00; }
#stats { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text3); white-space: nowrap; }

/* BODY */
#body { display: flex; flex: 1; overflow: hidden; }

/* SIDEBAR */
#sidebar { width: 224px; flex-shrink: 0; background: var(--sb);
  border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.sh { padding: 10px 14px 5px; font-size: 9px; font-weight: 600; color: var(--text3);
  text-transform: uppercase; letter-spacing: .1em; }
#fsearch { margin: 0 10px 7px; padding: 5px 10px; background: rgba(255,255,255,0.025);
  border: 1px solid var(--border); border-radius: 5px; color: var(--text2);
  font-family: 'Inter', sans-serif; font-size: 11px; outline: none; width: calc(100% - 20px); }
#fsearch::placeholder { color: var(--text3); }
#fsearch:focus { border-color: rgba(179,134,0,.35); }
#flist { flex: 1; overflow-y: auto; padding: 2px 0; }
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.fi { padding: 3px 10px; font-size: 11.5px; cursor: pointer; color: var(--text2);
  display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fi:hover { color: var(--text); }
.fi.hi { background: var(--brand-bg); color: var(--brand); }
.fi .fd { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
#legend { padding: 8px 10px 10px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
.li { display: flex; align-items: center; gap: 7px; }
.pill { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 500;
  padding: 2px 8px; border-radius: 10px; border: 1px solid; cursor: pointer;
  display: inline-flex; align-items: center; gap: 3px; transition: opacity .15s;
  min-width: 100px; }
.pill.off { opacity: .25; }
.lc { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text3); margin-left: auto; }

/* CANVAS */
#cwrap { flex: 1; position: relative; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; }
</style>

// ── Build type counts & edge pairs ────────────────────────────────────────────
const typeCounts = {};
NODES.forEach(n => typeCounts[n.type] = (typeCounts[n.type]||0) + 1);

const nodeMap = Object.fromEntries(NODES.map(n => [n.id, n]));
const EDGES = [];
NODES.forEach(n => {
  const pid = n.par;
  if (pid && nodeMap[pid]) EDGES.push([pid, n.id]);
});

// Update stats
const statsEl = document.getElementById('stats');
statsEl.textContent = `${NODES.length} nodes · ${EDGES.length} edges · Aldebaran Labs`;

// ── Seeded RNG ────────────────────────────────────────────────────────────────
function mkRng(seed) {
  let s = seed >>> 0;
  return () => { s = (Math.imul(1664525, s) + 1013904223) >>> 0; return s / 4294967296; };
}

function gauss(r) {
  const u = r() + 1e-9, v = r();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

// ── Galaxy layout ─────────────────────────────────────────────────────────────
const BASE_R = { class:8, folder:12, function:5, markdown:3, other:3, python:6 };
let W, H, stars = [];

function layoutGalaxy() {
  const canvas = document.getElementById('gc');
  W = canvas.width  = canvas.offsetWidth;
  H = canvas.height = canvas.offsetHeight;
  const cx = W * 0.52, cy = H * 0.50;
  const rng = mkRng(7919);

  // Spread factor per type (0 = center, 1 = outer edge)
  const spread = { class:0.45, folder:0.35, function:0.68, markdown:0.78, other:0.82, python:0.58 };

  NODES.forEach(n => {
    if (n.isGod) { n.gx = cx; n.gy = cy; return; }
    const s = (W * 0.30) * (spread[n.type] || 0.7);
    n.gx = cx + gauss(rng) * s * 0.85;
    n.gy = cy + gauss(rng) * s * 0.52; // compressed Y = galaxy disk tilt
    n.baseR = BASE_R[n.type] || 4;
  });
  NODES.find(n => n.isGod).baseR = 14;

  // Stars
  stars = [];
  const sr = mkRng(4321);
  for (let i = 0; i < 500; i++)
    stars.push({ x:sr()*W, y:sr()*H, s:sr()<0.08?1.5:1, o:0.25+sr()*0.65, ph:sr()*Math.PI*2 });
}

// ── Draw ──────────────────────────────────────────────────────────────────────
let frame = 0, galaxyMode = true;

function draw() {
  frame++;
  const canvas = document.getElementById('gc');
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, W, H);

  // Stars
  stars.forEach(s => {
    ctx.fillStyle = `rgba(255,255,255,${s.o * (0.55 + 0.45 * Math.sin(s.ph + frame * 0.008))})`;
    ctx.fillRect(Math.round(s.x), Math.round(s.y), s.s, s.s);
  });

  if (galaxyMode) {
    // Edges
    ctx.save();
    EDGES.forEach(([a, b]) => {
      const na = nodeMap[a], nb = nodeMap[b];
      if (!na || !nb || na.gx == null || nb.gx == null) return;
      ctx.beginPath();
      ctx.moveTo(na.gx, na.gy);
      ctx.lineTo(nb.gx, nb.gy);
      ctx.strokeStyle = `rgba(${na.type==='folder'?'245,160,32':na.type==='python'?'68,136,255':'180,160,255'},0.10)`;
      ctx.lineWidth = 0.5;
      ctx.stroke();
    });
    ctx.restore();

    // Nodes — sorted back-to-front
    const order = ['other','markdown','function','python','class','folder'];
    [...NODES].sort((a,b) => {
      if (a.isGod) return 1; if (b.isGod) return -1;
      return order.indexOf(a.type) - order.indexOf(b.type);
    }).forEach(n => {
      if (n.gx == null) return;
      const c = TC[n.type];
      const r = n.baseR;
      const pulse = n.isGod ? (1 + 0.04 * Math.sin(frame * 0.025)) : 1;
      ctx.save();

      if (n.isGod) {
        // Wide diffuse halo
        const rg = ctx.createRadialGradient(n.gx, n.gy, 0, n.gx, n.gy, r * 9 * pulse);
        rg.addColorStop(0,   'rgba(160,210,255,0.55)');
        rg.addColorStop(0.25,'rgba(100,170,255,0.25)');
        rg.addColorStop(0.6, 'rgba(60,120,240,0.08)');
        rg.addColorStop(1,   'rgba(30,80,200,0)');
        ctx.beginPath();
        ctx.arc(n.gx, n.gy, r * 9 * pulse, 0, Math.PI*2);
        ctx.fillStyle = rg;
        ctx.fill();
        ctx.shadowBlur = 35;
        ctx.shadowColor = '#80c0ff';
        ctx.beginPath();
        ctx.arc(n.gx, n.gy, r * pulse, 0, Math.PI*2);
        ctx.fillStyle = '#c0e0ff';
        ctx.fill();
      } else {
        // Outer glow
        ctx.shadowBlur = n.type==='folder' ? 20 : n.type==='class' ? 16 : n.type==='python' ? 12 : 8;
        ctx.shadowColor = c.dot;
        ctx.beginPath();
        ctx.arc(n.gx, n.gy, r, 0, Math.PI*2);
        ctx.fillStyle = c.dot;
        ctx.fill();
      }

      // Bright core (all nodes)
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(n.gx, n.gy, Math.max(r * 0.4 * pulse, 1.2), 0, Math.PI*2);
      ctx.fillStyle = n.isGod ? '#ffffff' : 'rgba(255,255,255,0.75)';
      ctx.fill();
      ctx.restore();
    });
  } else {
    // Nexus mode — flat dots + lines, no glow
    EDGES.forEach(([a, b]) => {
      const na = nodeMap[a], nb = nodeMap[b];
      if (!na || !nb || na.gx == null || nb.gx == null) return;
      ctx.beginPath();
      ctx.moveTo(na.gx, na.gy); ctx.lineTo(nb.gx, nb.gy);
      ctx.strokeStyle = 'rgba(180,160,255,0.18)';
      ctx.lineWidth = 0.7;
      ctx.stroke();
    });
    NODES.forEach(n => {
      if (n.gx == null) return;
      const c = TC[n.type];
      ctx.beginPath();
      ctx.arc(n.gx, n.gy, n.baseR * 0.7, 0, Math.PI*2);
      ctx.fillStyle = n.isGod ? '#c0e0ff' : c.dot;
      ctx.fill();
    });
  }

  requestAnimationFrame(draw);
}

// ── Sidebar ───────────────────────────────────────────────────────────────────
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function buildSidebar() {
  const list = document.getElementById('flist');
  NODES.forEach((n, i) => {
    const c = TC[n.type];
    const el = document.createElement('div');
    el.className = 'fi' + (n.isGod ? ' hi' : '');
    el.style.paddingLeft = (10 + n.lv * 10) + 'px';
    el.innerHTML = `<span class="fd" style="background:${c.dot}"></span>${esc(n.label)}`;
    el.addEventListener('click', () => {
      list.querySelectorAll('.fi.hi').forEach(e => e.classList.remove('hi'));
      el.classList.add('hi');
    });
    list.appendChild(el);
    el._node = n;
  });

  document.getElementById('fsearch').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    list.querySelectorAll('.fi').forEach(el => {
      el.style.display = q && !el._node.label.toLowerCase().includes(q) ? 'none' : '';
    });
  });
}

function buildLegend() {
  const leg = document.getElementById('legend');
  ['class','folder','function','markdown','other','python'].forEach(type => {
    if (!typeCounts[type]) return;
    const c = TC[type];
    const row = document.createElement('div');
    row.className = 'li';
    const pill = document.createElement('button');
    pill.className = 'pill';
    pill.style.cssText = `color:${c.dot};border-color:${c.border};background:${c.bg}`;
    pill.textContent = TC[type].icon + type;
    const cnt = document.createElement('span');
    cnt.className = 'lc';
    cnt.textContent = typeCounts[type];
    row.appendChild(pill); row.appendChild(cnt);
    leg.appendChild(row);
  });
}

// ── Mode toggle ───────────────────────────────────────────────────────────────
document.getElementById('btn-nexus').addEventListener('click', () => {
  galaxyMode = false;
  document.getElementById('btn-nexus').classList.add('active');
  document.getElementById('btn-galaxy').classList.remove('active');
});
document.getElementById('btn-galaxy').addEventListener('click', () => {
  galaxyMode = true;
  document.getElementById('btn-galaxy').classList.add('active');
  document.getElementById('btn-nexus').classList.remove('active');
});

// ── Init ──────────────────────────────────────────────────────────────────────
window.addEventListener('resize', layoutGalaxy);
buildSidebar();
buildLegend();
layoutGalaxy();
draw();
</script>
</body>
</html>
