<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f0e0c; --surface: #161310; --surface2: #1e1a14;
  --border: #2c271f; --text: #f0ebe3; --text-2: #9a8e7e;
  --text-3: #5c5248; --brand: #b38600; --brand-bg: rgba(179,134,0,0.10);
  --canvas: #0d0d10;
}
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  font-weight: 500; letter-spacing: -0.01em; line-height: 1.375; }
#app { display: flex; flex-direction: column; height: 100vh; }

/* TOPBAR */
#topbar { display: flex; align-items: center; gap: 14px;
  padding: 0 18px; height: 52px; flex-shrink: 0;
  background: var(--bg); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 8px; white-space: nowrap; user-select: none; }
.brand-logo { height: 20px; width: auto; display: block; color: var(--text); flex-shrink: 0; }
.brand-text { display: flex; align-items: baseline; gap: 5px; }
.brand-name { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
.brand-sub { font-family: 'Inter Display', 'Inter', system-ui, sans-serif; font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.072em; }
#layout-sw { display: flex; gap: 4px; margin-left: auto; }
.lbtn { background: var(--surface2); border: 1px solid var(--border); color: var(--text-2);
  font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 500; letter-spacing: -0.01em;
  padding: 5px 12px; border-radius: 6px; cursor: pointer; transition: all 0.12s; }
.lbtn:hover { border-color: var(--text-2); color: var(--text); }
.lbtn.active { background: var(--brand); border-color: var(--brand); color: #0f0e0c; font-weight: 600; }
#stats { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3); }

/* BODY */
#body { display: flex; flex: 1; overflow: hidden; }

/* SIDEBAR */
#sidebar { width: 230px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden; }
.sh { padding: 10px 14px 6px; font-family: 'Inter Display', 'Inter', system-ui, sans-serif;
  font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.072em; }
#fsearch { margin: 0 10px 8px; padding: 6px 10px; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 6px; color: var(--text);
  font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 500;
  letter-spacing: -0.01em; outline: none; width: calc(100% - 20px); }
#fsearch:focus { border-color: var(--brand); }
#fsearch::placeholder { color: var(--text-3); }
#flist { flex: 1; overflow-y: auto; padding: 2px 0; }
.fi { padding: 4px 12px; font-family: 'Inter', system-ui, sans-serif; font-size: 13px;
  font-weight: 500; letter-spacing: -0.01em; cursor: pointer; color: var(--text-2);
  display: flex; align-items: center; gap: 6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background 0.1s; }
.fi:hover { background: rgba(255,255,255,0.04); color: var(--text); }
.fi.hi { background: var(--brand-bg); color: var(--brand); }
.fd { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
#legend { padding: 10px 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
.li { display: flex; align-items: center; gap: 7px; }
.pill { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; font-weight: 500;
  letter-spacing: -0.01em; padding: 3px 9px; border-radius: 10px; cursor: pointer;
  border: 1px solid; transition: opacity 0.15s; user-select: none; width: 108px; }
.pill.off { opacity: 0.3; }
.lc { margin-left: auto; color: var(--text-3); font-family: 'JetBrains Mono', monospace; font-size: 10px; }

/* CANVAS */
#cwrap { flex: 1; position: relative; overflow: hidden; }
#gc { width: 100%; height: 100%; }

/* STABILIZING */
#stab { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
  background: rgba(15,14,12,0.92); border: 1px solid var(--border);
  padding: 7px 14px; border-radius: 20px; font-family: 'Inter', system-ui, sans-serif;
  font-size: 11px; letter-spacing: -0.01em; color: var(--text-3);
  display: flex; align-items: center; gap: 8px; z-index: 5; pointer-events: none; }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); animation: p 1s infinite; }
@keyframes p { 0%,100%{opacity:1}50%{opacity:.25} }

/* DETAIL PANEL */
#dp { width: 255px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border);
  overflow-y: auto; display: none; flex-direction: column; }
#dp.open { display: flex; }
#dh { padding: 14px 14px 12px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
#dn { font-family: 'Inter Display', 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600;
  word-break: break-all; line-height: 1.3; letter-spacing: -0.016em; }
#dc { background: none; border: none; color: var(--text-3); font-size: 20px; cursor: pointer;
  flex-shrink: 0; line-height: 1; padding: 0 2px; }
#dc:hover { color: var(--text); }
#db { padding: 12px 14px; flex: 1; }
.ds { margin-bottom: 14px; }
.dl { font-family: 'Inter Display', 'Inter', system-ui, sans-serif; font-size: 10px; font-weight: 600;
  color: var(--text-3); text-transform: uppercase; letter-spacing: 0.072em; margin-bottom: 6px; }
.dv { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; letter-spacing: -0.01em; color: var(--text); }
.dpath { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-2); word-break: break-all; }
.lk { display: flex; align-items: center; gap: 5px; font-family: 'JetBrains Mono', monospace;
  font-size: 11px; padding: 3px 6px; margin: 0 -6px; border-radius: 4px;
  color: var(--text-2); cursor: pointer; transition: background 0.1s; }
.lk:hover { background: rgba(255,255,255,0.04); color: var(--text); }
.la { font-size: 10px; }
.more { font-size: 10px; color: var(--text-3); padding: 3px 0; font-family: 'Inter', system-ui, sans-serif; }
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>

  {id:'index/features.md',     label:'features.md',     group:'markdown', level:1, isDir:false},

  // financial children
  {id:'financial/bookkeeping.csv', label:'bookkeeping.csv', group:'other', level:1, isDir:false},
  {id:'financial/cogs.csv',        label:'cogs.csv',        group:'other', level:1, isDir:false},
  {id:'financial/revenue.csv',     label:'revenue.csv',     group:'other', level:1, isDir:false},
];

const RAW_EDGES = [
  // containment: Security
  {from:'Security', to:'Security/checks', type:'contains'},
  {from:'Security', to:'Security/audit.py', type:'contains'},
  {from:'Security', to:'Security/report.py', type:'contains'},
  {from:'Security', to:'Security/__init__.py', type:'contains'},
  {from:'Security', to:'Security/tests.py', type:'contains'},
  {from:'Security', to:'Security/auth.py', type:'contains'},
  {from:'Security', to:'Security/idor.py', type:'contains'},
  {from:'Security', to:'Security/backups.py', type:'contains'},
  {from:'Security', to:'Security/payments.py', type:'contains'},
  {from:'Security', to:'Security/secrets.py', type:'contains'},
  {from:'Security', to:'Security/error_tracking.py', type:'contains'},
  // containment: checks
  {from:'Security/checks', to:'Security/checks/1-secrets.md', type:'contains'},
  {from:'Security/checks', to:'Security/checks/2-auth.md', type:'contains'},
  {from:'Security/checks', to:'Security/checks/3-idor.md', type:'contains'},
  {from:'Security/checks', to:'Security/checks/4-error-tracking.md', type:'contains'},
  {from:'Security/checks', to:'Security/checks/5-backups.md', type:'contains'},
  // containment: operations
  {from:'operations', to:'operations/projects_tasks.md', type:'contains'},
  {from:'operations', to:'operations/AGENTS.md', type:'contains'},
  {from:'operations', to:'operations/CLAUDE.md', type:'contains'},
  {from:'operations', to:'operations/_template.md', type:'contains'},
  // containment: legal
  {from:'legal', to:'legal/IRS', type:'contains'},
  {from:'legal', to:'legal/PSP', type:'contains'},
  {from:'legal', to:'legal/Utility Bills', type:'contains'},
  {from:'legal', to:'legal/Incorporation Documents', type:'contains'},
  {from:'legal', to:'legal/index.md', type:'contains'},
  {from:'legal', to:'legal/_template.md', type:'contains'},
  {from:'legal', to:'legal/Aldebaran_Labs_Off.pdf', type:'contains'},
  {from:'legal', to:'legal/AldbebaranLabsLLC9009.pdf', type:'contains'},
  {from:'legal', to:'legal/stripe_backup_code.txt', type:'contains'},
  {from:'legal', to:'legal/Free Basic Operating.doc', type:'contains'},
  {from:'legal', to:'legal/Initial Resolutions.doc', type:'contains'},
  // containment: meetings, clients, docs, index, templates, memory, financial
  {from:'meetings',  to:'meetings/kramer-salon.md', type:'contains'},
  {from:'clients',   to:'clients/Order_Management_System.md', type:'contains'},
  {from:'docs',      to:'docs/overview.md', type:'contains'},
  {from:'docs',      to:'docs/ai_native.md', type:'contains'},
  {from:'index',     to:'index/repos.md', type:'contains'},
  {from:'index',     to:'index/features.md', type:'contains'},
  {from:'index',     to:'index/intelligence.md', type:'contains'},
  {from:'templates', to:'templates/CLAUDE.md', type:'contains'},
  {from:'templates', to:'templates/KNOWLEDGE.md', type:'contains'},
  {from:'memory',    to:'memory/user.md', type:'contains'},
  {from:'memory',    to:'memory/feedback.md', type:'contains'},
  {from:'memory',    to:'memory/project.md', type:'contains'},
  {from:'memory',    to:'memory/MEMORY.md', type:'contains'},
  {from:'financial', to:'financial/bookkeeping.csv', type:'contains'},
  {from:'financial', to:'financial/cogs.csv', type:'contains'},
  {from:'financial', to:'financial/revenue.csv', type:'contains'},
  // import/reference edges
  {from:'AGENTS.md', to:'operations/AGENTS.md', type:'imports'},
  {from:'CLAUDE.md', to:'docs/overview.md', type:'imports'},
];

// Invisible center anchor — all level-0 nodes pull toward it, making it the hub
RAW_NODES.push({id:'__ROOT__', label:'', group:'other', level:-1, isDir:true, __hidden:true});
RAW_NODES.filter(n => n.level === 0).forEach(n => RAW_EDGES.push({from:'__ROOT__', to:n.id, type:'root'}));

// 120 deterministic cross-edges — stitches all subtrees into one connected web
;(()=>{
  const r=(s=>{let v=s%2147483647;return()=>{v=v*16807%2147483647;return(v-1)/2147483646}})(7919);
  const ids = RAW_NODES.filter(n=>!n.__hidden).map(n=>n.id);
  for(let i=0;i<120;i++){
    const a=ids[Math.floor(r()*ids.length)], b=ids[Math.floor(r()*ids.length)];
    if(a!==b) RAW_EDGES.push({from:a, to:b, type:'semantic'});
  }
})();

// ── state ─────────────────────────────────────────────────────────────────────
let graph, nodeMap = {}, hiddenTypes = new Set(), selectedNodeId = null;
nodeMap = Object.fromEntries(RAW_NODES.map(n => [n.id, n]));

// ── node sprite renderer ──────────────────────────────────────────────────────
const _sm = {};
function nodeSprite(node) {
  if (node.__hidden) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({transparent:true,opacity:0}));
    s.scale.set(1,1,1);
    return s;
  }
  const hex = (GC[node.group]||GC.other).border;
  if (!_sm[hex]) {
    const cv = document.createElement('canvas'); cv.width = cv.height = 32;
    const cx = cv.getContext('2d'), n = parseInt(hex.slice(1),16);
    const rv=(n>>16)&255, gv=(n>>8)&255, bv=n&255;
    const gr = cx.createRadialGradient(16,16,0,16,16,16);
    gr.addColorStop(0,   `rgba(${rv},${gv},${bv},1)`);
    gr.addColorStop(0.35,`rgba(${rv},${gv},${bv},0.6)`);
    gr.addColorStop(1,   `rgba(${rv},${gv},${bv},0)`);
    cx.fillStyle = gr; cx.fillRect(0,0,32,32);
    _sm[hex] = new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true,depthWrite:false});
  }
  const sp = new THREE.Sprite(_sm[hex]);
  sp.scale.set(node.isDir?12:6, node.isDir?12:6, 1);
  return sp;
}
const getColor = n => n.id === selectedNodeId ? '#ffffff' : (GC[n.group] || GC.other).border;

// ── sidebar ───────────────────────────────────────────────────────────────────
const VISIBLE_NODES = RAW_NODES.filter(n => !n.__hidden);
function buildSidebar() {
  renderList(VISIBLE_NODES);
  document.getElementById('fsearch').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    renderList(q ? VISIBLE_NODES.filter(n => n.label.toLowerCase().includes(q)) : VISIBLE_NODES);
  });
}
function renderList(nodes) {
  const list = document.getElementById('flist');
  const frag = document.createDocumentFragment();
  nodes.slice(0,300).forEach(n => {
    const c = GC[n.group] || GC.other;
    const el = document.createElement('div');
    el.className = 'fi';
    el.style.paddingLeft = `${12 + n.level * 9}px`;
    el.innerHTML = `<div class="fd" style="background:${c.border}"></div>${esc(n.label)}`;
    el.addEventListener('click', () => focusNode(n.id));
    frag.appendChild(el);
  });
  list.innerHTML = '';
  list.appendChild(frag);
}
function buildLegend() {
  const types = [...new Set(VISIBLE_NODES.map(n => n.group))].sort();
  const leg = document.getElementById('legend');
  leg.innerHTML = '';
  types.forEach(type => {
    const c = GC[type] || GC.other;
    const count = VISIBLE_NODES.filter(n => n.group === type).length;
    const row = document.createElement('div'); row.className = 'li';
    const pill = document.createElement('button'); pill.className = 'pill';
    pill.textContent = `${ICONS[type]||'•'} ${type}`;
    pill.style.cssText = `color:${c.text};border-color:${c.border};background:${c.bg}`;
    pill.addEventListener('click', () => {
      hiddenTypes.has(type) ? hiddenTypes.delete(type) : hiddenTypes.add(type);
      pill.classList.toggle('off');
      applyFilters();
    });
    const cnt = document.createElement('span'); cnt.className = 'lc'; cnt.textContent = count;
    row.appendChild(pill); row.appendChild(cnt); leg.appendChild(row);
  });
}

function hexToRgba(hex, a) {
  const n = parseInt(hex.replace('#',''), 16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}

// ── graph ─────────────────────────────────────────────────────────────────────
function renderGraph() {
  const gc = document.getElementById('gc');
  const stab = document.getElementById('stab');
  stab.style.display = 'flex';

  graph = ForceGraph3D()(gc)
    .width(gc.offsetWidth).height(gc.offsetHeight)
    .backgroundColor('#0d0d10')
    .graphData({
      nodes: RAW_NODES.map(n => ({...n})),
      links: RAW_EDGES.map(e => ({ source: e.from, target: e.to, type: e.type }))
    })
    .nodeLabel(n => n.__hidden ? '' : n.id)
    .nodeThreeObject(nodeSprite)
    .nodeThreeObjectExtend(false)
    .linkColor(l => {
      if (l.type === 'imports') return 'rgba(179,134,0,0.9)';
      if (l.type === 'root')    return 'rgba(255,255,255,0.06)';
      if (l.type === 'semantic') return 'rgba(120,140,220,0.15)';
      const sid = typeof l.source === 'object' ? l.source.id : l.source;
      return hexToRgba((GC[nodeMap[sid]?.group] || GC.other).border, 0.2);
    })
    .linkWidth(l => l.type === 'imports' ? 1.5 : 0.4)
    .linkDirectionalArrowLength(l => l.type === 'imports' ? 5 : 0)
    .linkDirectionalArrowRelPos(1)
    .linkCurvature(l => l.type === 'imports' ? 0.5 : 0.35)
    .enableNodeDrag(true)
    .onNodeClick(node => {
      if (node.__hidden) return;
      selectedNodeId = node.id;
      showDetail(node.id);
    })
    .onBackgroundClick(() => {
      selectedNodeId = null;
      closeDetail();
    })
    .onEngineStop(() => { stab.style.display = 'none'; });

  // Pin root anchor at origin so all subtrees orbit the center
  const rootNode = graph.graphData().nodes.find(n => n.id === '__ROOT__');
  if (rootNode) { rootNode.fx = 0; rootNode.fy = 0; rootNode.fz = 0; }

  // Weak repulsion + very short links + strong center → one cohesive blob
  graph.d3Force('charge').strength(-6);
  graph.d3Force('link').distance(l => l.type==='root' ? 8 : 4).strength(l => l.type==='root' ? 2.5 : 1.2);
  graph.d3Force('center').strength(2.0);

  new ResizeObserver(() => graph.width(gc.offsetWidth).height(gc.offsetHeight)).observe(gc);
  const visibleNodes = RAW_NODES.filter(n => !n.__hidden).length;
  const visibleEdges = RAW_EDGES.filter(e => e.type !== 'root').length;
  document.getElementById('stats').textContent = `${visibleNodes} nodes · ${visibleEdges} edges`;
}

// ── layout switching ──────────────────────────────────────────────────────────
function setupLayoutBtns() {
  document.querySelectorAll('.lbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.lbtn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      switchLayout(btn.dataset.l);
    });
  });
}
function switchLayout(mode) {
  if (!graph) return;
  document.getElementById('stab').style.display = 'flex';
  graph.dagMode(mode === 'force' ? null : mode === 'hierarchy' ? 'td' : 'radialout');
  graph.d3ReheatSimulation();
}

// ── filters ───────────────────────────────────────────────────────────────────
function applyFilters() {
  graph.nodeVisibility(n => !hiddenTypes.has(n.group));
  graph.linkVisibility(l => {
    const sid = typeof l.source === 'object' ? l.source.id : l.source;
    const tid = typeof l.target === 'object' ? l.target.id : l.target;
    return !hiddenTypes.has(nodeMap[sid]?.group) && !hiddenTypes.has(nodeMap[tid]?.group);
  });
}

// ── detail panel ──────────────────────────────────────────────────────────────
function focusNode(id) {
  if (!graph) return;
  const node = graph.graphData().nodes.find(n => n.id === id);
  if (!node) return;
  graph.cameraPosition({ x: node.x, y: node.y, z: (node.z||0) + 160 }, node, 600);
  selectedNodeId = id;
  graph.nodeColor(getColor);
  showDetail(id);
}
// ── detail panel ──────────────────────────────────────────────────────────────
function showDetail(id) {
  const n = nodeMap[id];
  if (!n) return;
  const c = GC[n.group] || GC.other;
  const outE = RAW_EDGES.filter(e => e.from === id);
  const inE  = RAW_EDGES.filter(e => e.to   === id);
  document.getElementById('dn').textContent = n.label;
  document.getElementById('dn').style.color = c.text;
  const makeLinks = (edges, dir) => {
    const target = dir==='out' ? 'to' : 'from';
    const arrow  = dir==='out'
      ? `<span class="la" style="color:#b38600">→</span>`
      : `<span class="la" style="color:#10b981">←</span>`;
    return edges.slice(0,25).map(e => {
      const label = esc(e[target].split('/').pop());
      return `<div class="lk" data-node="${esc(e[target])}">${arrow}${label}</div>`;
    }).join('') + (edges.length>25 ? `<div class="more">…${edges.length-25} more</div>` : '');
  };
  document.getElementById('db').innerHTML = `
    <div class="ds"><div class="dl">Path</div><div class="dpath">${esc(n.id)}</div></div>
    <div class="ds"><div class="dl">Type</div><div class="dv">${ICONS[n.group]||'•'} ${esc(n.group)}</div></div>
    ${outE.length ? `<div class="ds"><div class="dl">Contains / Links (${outE.length})</div>${makeLinks(outE,'out')}</div>` : ''}
    ${inE.length  ? `<div class="ds"><div class="dl">Referenced by (${inE.length})</div>${makeLinks(inE,'in')}</div>` : ''}
    ${!outE.length&&!inE.length ? `<div class="dv" style="color:#334155">No connections</div>` : ''}
  `;
  document.getElementById('dp').classList.add('open');
  document.getElementById('db').querySelectorAll('.lk[data-node]').forEach(el => {
    el.addEventListener('click', () => focusNode(el.dataset.node));
  });
}

function closeDetail() {
  document.getElementById('dp').classList.remove('open');
}

document.getElementById('dc').addEventListener('click', () => {
  selectedNodeId = null;
  graph?.nodeColor(getColor);
  closeDetail();
});

buildSidebar();
buildLegend();
renderGraph();
setupLayoutBtns();
</script>
